<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>essence.crew — 3D</title>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
html,body{width:100%;height:100%;overflow:hidden;background:#0d0a06;}
canvas{position:fixed;inset:0;width:100%!important;height:100%!important;}
.scanlines{position:fixed;inset:0;z-index:5;pointer-events:none;
  background:repeating-linear-gradient(transparent,transparent 3px,rgba(0,0,0,.13) 3px,rgba(0,0,0,.13) 4px);}
.edge{position:fixed;left:0;top:0;bottom:0;width:3px;z-index:6;
  background:linear-gradient(180deg,transparent,#9b4a1e 15%,#c4612a 50%,#9b4a1e 85%,transparent);}
nav{position:fixed;top:0;left:0;right:0;z-index:20;
  display:flex;align-items:center;justify-content:space-between;
  padding:18px 50px;
  background:linear-gradient(to bottom,rgba(10,7,3,.75),transparent);
  font-family:Impact,'Arial Black',sans-serif;}
.logo{font-size:1.1rem;letter-spacing:4px;color:#e8d898;-webkit-text-stroke:1px #7a3818;}
.nav-links{display:flex;gap:24px;font-family:-apple-system,sans-serif;font-size:.68rem;
  letter-spacing:3px;text-transform:uppercase;color:rgba(200,160,80,.4);}
.ui{position:fixed;bottom:0;left:0;right:0;z-index:10;
  padding:0 50px 50px;pointer-events:none;
  background:linear-gradient(to top,rgba(10,7,3,.96) 0%,rgba(10,7,3,.5) 50%,transparent 100%);
  font-family:Impact,'Arial Black',sans-serif;}
.eyebrow{font-family:monospace;font-size:.55rem;letter-spacing:6px;text-transform:uppercase;
  color:rgba(190,120,55,.65);margin-bottom:10px;}
.title{font-size:clamp(3rem,7vw,5.5rem);font-weight:900;text-transform:uppercase;
  line-height:.85;letter-spacing:3px;color:#e8d898;
  -webkit-text-stroke:2px #7a3818;
  text-shadow:4px 4px 0 rgba(5,2,0,.95);}
.crew{display:block;color:rgba(232,216,152,.38);-webkit-text-stroke:1.5px #5c2a10;text-shadow:none;}
.uline{display:block;width:65px;height:1px;margin:12px 0 18px;background:linear-gradient(90deg,#c4612a,transparent);}
.row{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;}
.sub{font-family:-apple-system,sans-serif;font-size:.78rem;letter-spacing:2px;text-transform:uppercase;
  color:rgba(200,160,80,.45);max-width:260px;line-height:1.65;}
.cta{display:flex;gap:10px;pointer-events:auto;}
.btn{font-family:-apple-system,sans-serif;font-size:.68rem;letter-spacing:3px;text-transform:uppercase;
  padding:10px 24px;border:none;cursor:pointer;font-weight:700;background:#7a3818;color:#e8d898;}
.btn-g{background:transparent;border:1px solid rgba(196,97,42,.5);
  font-family:-apple-system,sans-serif;font-size:.68rem;letter-spacing:3px;text-transform:uppercase;
  padding:10px 24px;cursor:pointer;color:rgba(200,160,80,.5);}
.hint{position:fixed;top:85px;right:36px;z-index:20;font-family:monospace;font-size:.48rem;
  letter-spacing:3px;color:rgba(200,160,80,.25);text-transform:uppercase;text-align:right;line-height:2;}
#loading{position:fixed;inset:0;z-index:100;background:#0d0a06;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;
  transition:opacity .8s ease;}
#loading.done{opacity:0;pointer-events:none;}
#loading p{font-family:monospace;font-size:.58rem;letter-spacing:4px;color:rgba(200,160,80,.5);text-transform:uppercase;}
.lbar{width:180px;height:1px;background:rgba(122,56,24,.2);overflow:hidden;position:relative;}
.lbar i{position:absolute;top:0;left:0;bottom:0;background:linear-gradient(90deg,#7a3818,#c4612a,#e8d898);
  animation:lb 1.5s ease-in-out forwards;}
@keyframes lb{from{width:0}to{width:100%}}
</style>
</head>
<body>

<div id="loading"><p>Carregando 3D</p><div class="lbar"><i></i></div></div>

<nav>
  <div class="logo">ESSENCE.CREW</div>
  <div class="nav-links"><span>Eventos</span><span>Merch</span><span>Parcerias</span><span>Contacto</span></div>
</nav>

<canvas id="c"></canvas>
<div class="scanlines"></div>
<div class="edge"></div>
<div class="hint">move o rato →<br>scroll ↓</div>

<div class="ui">
  <div class="eyebrow">Car culture · Portugal · Est. MMXXIV</div>
  <h1 class="title">ESSENCE<span class="crew">CREW</span></h1>
  <span class="uline"></span>
  <div class="row">
    <p class="sub">Eventos de carros modificados.<br>Cultura. Comunidade. Velocidade.</p>
    <div class="cta">
      <button class="btn">Ver Eventos</button>
      <button class="btn-g">Explorar Merch</button>
    </div>
  </div>
</div>

<script type="module">
import * as THREE from 'three';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass }     from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass }     from 'three/addons/postprocessing/OutputPass.js';

/* ─── RENDERER ─── */
const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.6;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;

const W = innerWidth, H = innerHeight;
renderer.setSize(W, H);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0d0a06);
scene.fog = new THREE.FogExp2(0x0d0a06, 0.04);

const camera = new THREE.PerspectiveCamera(45, W / H, 0.1, 100);
camera.position.set(0, 0.8, 7);
camera.lookAt(0, 0, 0);

function onResize() {
  renderer.setSize(innerWidth, innerHeight);
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  composer.setSize(innerWidth, innerHeight);
}
window.addEventListener('resize', onResize);

/* ─── POST FX ─── */
const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
const bloom = new UnrealBloomPass(
  new THREE.Vector2(innerWidth, innerHeight),
  0.8,   // strength
  0.5,   // radius
  0.1    // threshold — lower = more glow
);
composer.addPass(bloom);
composer.addPass(new OutputPass());

/* ─── ENVIRONMENT ─── */
const pmrem = new THREE.PMREMGenerator(renderer);
pmrem.compileEquirectangularShader();

// Warm studio env — simulates orange key + white ceiling
const envColors = [
  new THREE.Color(0xc4612a), // +X warm
  new THREE.Color(0x1a0e06), // -X dark
  new THREE.Color(0xe8d898), // +Y ceiling (bright)
  new THREE.Color(0x060402), // -Y floor
  new THREE.Color(0xd4b060), // +Z front warm
  new THREE.Color(0x0a0804), // -Z back dark
];
const cubeRT = new THREE.WebGLCubeRenderTarget(128);
cubeRT.fromEquirectangularTexture(renderer, (() => {
  const c = document.createElement('canvas');
  c.width = 512; c.height = 256;
  const ctx = c.getContext('2d');
  const g = ctx.createLinearGradient(0, 0, 0, 256);
  g.addColorStop(0, '#d4b060');
  g.addColorStop(0.3, '#c4612a');
  g.addColorStop(0.6, '#3a1a08');
  g.addColorStop(1, '#060402');
  ctx.fillStyle = g; ctx.fillRect(0, 0, 512, 256);
  const t = new THREE.CanvasTexture(c);
  t.mapping = THREE.EquirectangularReflectionMapping;
  return t;
})());
scene.environment = pmrem.fromCubemap(cubeRT.texture).texture;
scene.environmentIntensity = 1.5;

/* ─── LIGHTS ─── */
// Very strong ambient so nothing is pitch black
scene.add(new THREE.AmbientLight(0x9a8878, 1.8));

// Key — neutral warm (less orange)
const key = new THREE.DirectionalLight(0xd4b090, 5.0);
key.position.set(4, 6, 5);
key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);
key.shadow.camera.near = 0.5;
key.shadow.camera.far = 25;
key.shadow.camera.left = -6; key.shadow.camera.right = 6;
key.shadow.camera.top = 6;   key.shadow.camera.bottom = -6;
key.shadow.bias = -0.001;
scene.add(key);

// Fill — cool grey-brown
const fill = new THREE.DirectionalLight(0x8a7060, 2.5);
fill.position.set(-6, 3, 2);
scene.add(fill);

// Rim — soft white/cream
const rim = new THREE.DirectionalLight(0xd8d0c0, 3.0);
rim.position.set(0, 5, -8);
scene.add(rim);

// Under — subtle terracotta, not screaming
const under = new THREE.PointLight(0xc4612a, 2.5, 8);
under.position.set(2, -1, 2);
scene.add(under);

// Orbit — toned down
const orbit = new THREE.PointLight(0xd4b878, 2.5, 10);
orbit.position.set(3, 2, 2);
scene.add(orbit);

/* ─── MATERIALS ─── */
const M = {
  chrome: new THREE.MeshPhysicalMaterial({
    color: 0xd4b896, metalness: 1.0, roughness: 0.07,
    envMapIntensity: 3.0, clearcoat: 1.0, clearcoatRoughness: 0.04
  }),
  darkMetal: new THREE.MeshPhysicalMaterial({
    color: 0x2a2018, metalness: 0.9, roughness: 0.4, envMapIntensity: 2.0
  }),
  terra: new THREE.MeshPhysicalMaterial({
    color: 0x8a4020, metalness: 0.65, roughness: 0.5, envMapIntensity: 1.5
  }),
  terra2: new THREE.MeshPhysicalMaterial({
    color: 0xc4612a, metalness: 0.75, roughness: 0.3, envMapIntensity: 2.0,
    emissive: new THREE.Color(0x5a2010), emissiveIntensity: 0.6
  }),
  gold: new THREE.MeshPhysicalMaterial({
    color: 0xe8d898, metalness: 1.0, roughness: 0.03,
    envMapIntensity: 4.0, clearcoat: 1.0, clearcoatRoughness: 0.02
  }),
  tire: new THREE.MeshStandardMaterial({
    color: 0x181410, metalness: 0.0, roughness: 0.95
  }),
  brake: new THREE.MeshPhysicalMaterial({
    color: 0x3a2a18, metalness: 0.9, roughness: 0.5, envMapIntensity: 1.5
  }),
};

/* ══ WHEEL ══ */
const wheel = new THREE.Group();
wheel.position.set(1.8, -0.1, 0);
wheel.rotation.y = -0.4;

// Tire
const tireVerts = [[0.98,0.15],[1.03,0.12],[1.08,0.07],[1.11,0.0],[1.08,-0.07],[1.03,-0.12],[0.98,-0.15]]
  .map(v => new THREE.Vector2(v[0], v[1]));
const tire = new THREE.Mesh(new THREE.LatheGeometry(tireVerts, 64), M.tire);
tire.castShadow = true; tire.receiveShadow = true;
wheel.add(tire);

// Rim barrel
const barrelVerts = [[0.60,0.14],[0.72,0.13],[0.86,0.09],[0.94,0.04],[0.97,0.0],[0.94,-0.04],[0.86,-0.09],[0.72,-0.13],[0.60,-0.14]]
  .map(v => new THREE.Vector2(v[0], v[1]));
wheel.add(Object.assign(new THREE.Mesh(new THREE.LatheGeometry(barrelVerts, 48), M.darkMetal), {castShadow:true}));

// Gold lip
wheel.add(new THREE.Mesh(new THREE.TorusGeometry(0.97, 0.022, 10, 64), M.gold));
wheel.add(new THREE.Mesh(new THREE.TorusGeometry(0.70, 0.016, 8, 64), M.chrome));

// 5 spokes
for (let s = 0; s < 5; s++) {
  const angle = (s / 5) * Math.PI * 2;
  const shape = new THREE.Shape();
  shape.moveTo(-0.055, 0.12);
  shape.quadraticCurveTo(-0.08, 0.5, -0.038, 0.85);
  shape.lineTo(0.038, 0.85);
  shape.quadraticCurveTo(0.08, 0.5, 0.055, 0.12);
  shape.closePath();
  const spoke = new THREE.Mesh(
    new THREE.ExtrudeGeometry(shape, { depth:0.05, bevelEnabled:true, bevelSize:0.012, bevelThickness:0.012, bevelSegments:3 }),
    M.chrome
  );
  spoke.rotation.z = angle + Math.PI;
  spoke.position.z = -0.025;
  spoke.castShadow = true;
  wheel.add(spoke);
}

// Center cap
const cap = new THREE.Mesh(new THREE.CylinderGeometry(0.14, 0.12, 0.07, 32), M.terra2);
cap.rotation.x = Math.PI / 2; cap.position.z = 0.05;
wheel.add(cap);
const capDisc = new THREE.Mesh(new THREE.CircleGeometry(0.1, 32), M.gold);
capDisc.position.z = 0.09;
wheel.add(capDisc);

// Lug nuts
for (let n = 0; n < 5; n++) {
  const a = (n / 5) * Math.PI * 2 + Math.PI / 5;
  const nut = new THREE.Mesh(new THREE.CylinderGeometry(0.025, 0.025, 0.055, 6), M.gold);
  nut.rotation.x = Math.PI / 2;
  nut.position.set(Math.cos(a) * 0.22, Math.sin(a) * 0.22, 0.075);
  wheel.add(nut);
}

// Brake disc
const disc = new THREE.Mesh(new THREE.CylinderGeometry(0.57, 0.57, 0.04, 48), M.brake);
disc.rotation.x = Math.PI / 2; disc.position.z = -0.08; disc.castShadow = true;
wheel.add(disc);

// Caliper
const caliper = new THREE.Mesh(new THREE.BoxGeometry(0.28, 0.17, 0.14), M.terra2);
caliper.position.set(-0.52, -0.08, -0.09); caliper.castShadow = true;
wheel.add(caliper);
for (let p = 0; p < 2; p++) {
  const piston = new THREE.Mesh(new THREE.CylinderGeometry(0.03, 0.03, 0.06, 12), M.chrome);
  piston.rotation.z = Math.PI / 2;
  piston.position.set(-0.52, -0.08 + (p - 0.5) * 0.08, -0.05);
  wheel.add(piston);
}

scene.add(wheel);

/* ── GROUND ── */
const ground = new THREE.Mesh(
  new THREE.PlaneGeometry(40, 40),
  new THREE.MeshStandardMaterial({ color: 0x100c08, roughness: 0.9, metalness: 0.1 })
);
ground.rotation.x = -Math.PI / 2;
ground.position.y = -1.8;
ground.receiveShadow = true;
scene.add(ground);

// Ground glow disc under wheel
const glow = new THREE.Mesh(
  new THREE.CircleGeometry(1.4, 32),
  new THREE.MeshBasicMaterial({ color: 0xc4612a, transparent: true, opacity: 0.12 })
);
glow.rotation.x = -Math.PI / 2;
glow.position.set(1.8, -1.79, 0);
scene.add(glow);

/* ── RETRO GRID ── */
const gridG = new THREE.Group();
gridG.position.y = -1.79;
for (let i = 0; i < 28; i++) {
  const z = -i * 4;
  const w = 18 * (1 + i * 0.09);
  const op = Math.max(0.04, 0.45 - i * 0.015);
  gridG.add(new THREE.Line(
    new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(-w,0,z), new THREE.Vector3(w,0,z)]),
    new THREE.LineBasicMaterial({ color: i===0 ? 0xc4612a : 0x7a3818, transparent:true, opacity:op })
  ));
}
for (let j = -6; j <= 6; j++) {
  const pts = [];
  for (let i = 0; i <= 28; i++) {
    const w = 18*(1+i*0.09);
    pts.push(new THREE.Vector3((j/6)*w, 0, -i*4));
  }
  gridG.add(new THREE.Line(
    new THREE.BufferGeometry().setFromPoints(pts),
    new THREE.LineBasicMaterial({ color: j===0?0xc4612a:0x7a3818, transparent:true, opacity: j===0?.35:.08 })
  ));
}
scene.add(gridG);

/* ── PARTICLES ── */
const PC = 500;
const pArr = new Float32Array(PC * 3);
const pVel = new Float32Array(PC * 3);
const pLife = new Float32Array(PC);
function resetP(i) {
  pArr[i*3]   = 1.3 + (Math.random()-.5)*.5;
  pArr[i*3+1] = -0.4 + (Math.random()-.5)*.3;
  pArr[i*3+2] = 0 + (Math.random()-.5)*.4;
  pVel[i*3]   = (Math.random()-.5)*.025;
  pVel[i*3+1] = Math.random()*.03+.006;
  pVel[i*3+2] = (Math.random()-.5)*.02;
  pLife[i]    = Math.random();
}
for (let i = 0; i < PC; i++) resetP(i);
const pGeo = new THREE.BufferGeometry();
pGeo.setAttribute('position', new THREE.BufferAttribute(pArr, 3));
const pMat = new THREE.PointsMaterial({ color: 0xffa060, size: 0.045, transparent:true, opacity:.85, sizeAttenuation:true });
scene.add(new THREE.Points(pGeo, pMat));

/* ── FLOATERS ── */
const floaters = [];
[[M.chrome,0],[M.terra2,1],[M.gold,2],[M.chrome,0],[M.terra2,1],[M.gold,2],
 [M.chrome,0],[M.terra2,1],[M.gold,2],[M.chrome,0],[M.terra2,1],[M.gold,2]].forEach(([ mat,gi ],i)=>{
  const geos=[new THREE.OctahedronGeometry(.1,0),new THREE.IcosahedronGeometry(.09,0),new THREE.TetrahedronGeometry(.11,0)];
  const m = new THREE.Mesh(geos[gi], mat);
  m.position.set((Math.random()-.5)*10,(Math.random()-.5)*4+.5,(Math.random()-.5)*6-1);
  m.castShadow=true;
  m._rx=(Math.random()-.5)*.009; m._ry=(Math.random()-.5)*.009;
  m._phase=Math.random()*Math.PI*2;
  scene.add(m); floaters.push(m);
});

/* ── MOUSE ── */
let mx=0,my=0;
document.addEventListener('mousemove',e=>{
  mx=(e.clientX/innerWidth-.5)*2;
  my=(e.clientY/innerHeight-.5)*2;
});

/* ── ANIMATE ── */
const clock=new THREE.Clock();
function animate(){
  requestAnimationFrame(animate);
  const t=clock.getElapsedTime();

  wheel.rotation.z -= 0.011;
  wheel.rotation.y += (-mx*.5-wheel.rotation.y)*.04;
  wheel.rotation.x += (-my*.22-wheel.rotation.x)*.04;
  wheel.position.y = Math.sin(t*.5)*.07-.1;

  gridG.position.z = (t*1.6)%4;

  camera.position.x += (mx*.7-camera.position.x)*.03;
  camera.position.y += (.8-my*.4-camera.position.y)*.03;
  camera.lookAt(0,0,0);

  orbit.position.x=Math.sin(t*.45)*3+1;
  orbit.position.y=Math.cos(t*.35)*1.5+1;
  orbit.intensity=2.0+Math.sin(t*2)*.5;
  under.intensity=2.0+Math.sin(t*3)*.3;

  for(let i=0;i<PC;i++){
    pLife[i]-=.007;
    if(pLife[i]<=0){resetP(i);continue;}
    pArr[i*3]+=pVel[i*3]; pArr[i*3+1]+=pVel[i*3+1]; pArr[i*3+2]+=pVel[i*3+2];
  }
  pGeo.attributes.position.needsUpdate=true;
  pMat.opacity=.65+Math.sin(t*5)*.15;

  floaters.forEach(f=>{
    f.rotation.x+=f._rx; f.rotation.y+=f._ry;
    f.position.y+=Math.sin(t*.5+f._phase)*.003;
  });

  composer.render();
}

setTimeout(()=>document.getElementById('loading').classList.add('done'),1000);
animate();
</script>
</body>
</html>
